spring.application.name=gerenciamento-tarefas-web
spring.datasource.url=${TAREFAS_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=GerenciamentoTarefas;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${TAREFAS_DB_USER:}
spring.datasource.password=${TAREFAS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=dbo
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false

spring.ai.model.chat=${TAREFAS_AI_MODEL:none}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${TAREFAS_AI_CHAT_MODEL:gpt-4o-mini}
